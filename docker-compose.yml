# Claude Code 토큰 사용량 감사용 로컬 스택 (Loki + Grafana)
# Claude Code 가 OTLP(HTTP) 로 보내는 이벤트를 Loki 가 직접 받는다. 로컬 전용이라 127.0.0.1 에만 바인딩한다.
name: claude-code-telemetry

services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-23100}:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    # Windows 부팅 직후 WSL 경로가 붙기 전에 시작되면 바인드 마운트가 빈 폴더로 잡혀 대시보드가 사라진다.
    # 대시보드·프로비저닝 파일이 안 보이면 실패로 끝내 restart 정책이 다시 띄우게 한다.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /var/lib/grafana/dashboards/claude-code-tokens.json ] || [ ! -f /etc/grafana/provisioning/dashboards/dashboards.yaml ]; then
          echo "대시보드 파일이 마운트되지 않았다. 5초 뒤 종료해 재시작을 기다린다." >&2
          sleep 5
          exit 1
        fi
        exec /run.sh
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-23000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claude-code-tokens.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
