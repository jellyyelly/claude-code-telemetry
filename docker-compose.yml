# Claude Code 토큰 사용량 감사용 로컬 스택 (Loki + Grafana)
# Claude Code 가 OTLP(HTTP) 로 보내는 이벤트를 Loki 가 직접 받는다. 로컬 전용이라 127.0.0.1 에만 바인딩한다.
name: claude-code-telemetry

services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-23100}:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-23000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claude-code-tokens.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
